{% extends "base.html" %}
{% block title %}New work order · Train Maintenance{% endblock %}
{% block content %}

<div class="page-header">
  <h1>New work order</h1>
  <div class="actions">
    <a class="btn btn-secondary" href="{{ url_for('work_orders_list') }}">&larr; Back</a>
  </div>
</div>

<form method="post" class="card">
  <div class="form-row">
    <div>
      <label>Train</label>
      <select name="train_id" required>
        {% for t in trains %}
          {% set preselect = request.args.get('train_id')|string == t.id|string %}
          <option value="{{ t.id }}" {% if preselect %}selected{% endif %}>{{ t.equipment_number }} — {{ t.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>Linked maintenance plan (optional)</label>
      <select name="plan_id">
        <option value="">— none —</option>
        {% for p in plans %}
          <option value="{{ p.id }}">{{ p.plan_number }} — {{ p.description }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>Order number (auto if blank)</label>
      <input type="text" name="order_number" placeholder="WO-1100101">
    </div>
  </div>

  <div class="form-row">
    <div>
      <label>Description</label>
      <input type="text" name="description" required>
    </div>
    <div>
      <label>Order type</label>
      <select name="order_type">
        <option value="PM01">PM01 — Planned preventive</option>
        <option value="PM02">PM02 — Corrective</option>
        <option value="PM03">PM03 — Project</option>
      </select>
    </div>
    <div>
      <label>Priority</label>
      <select name="priority">
        {% for p in priorities %}<option value="{{ p }}" {% if p=='3-normal' %}selected{% endif %}>{{ p }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label>Scheduled start</label>
      <input type="datetime-local" name="scheduled_start" required>
    </div>
    <div>
      <label>Scheduled end</label>
      <input type="datetime-local" name="scheduled_end">
    </div>
    <div>
      <label>Estimated hours</label>
      <input type="number" step="0.5" name="estimated_hours" value="4">
    </div>
  </div>

  <div class="form-row">
    <div>
      <label>Technician</label>
      <select name="technician_id">
        <option value="">— unassigned —</option>
        {% for tech in technicians %}
          <option value="{{ tech.id }}">{{ tech.name }} — {{ tech.qualification }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>Status</label>
      <select name="status">
        {% for s in statuses %}<option value="{{ s }}" {% if s=='scheduled' %}selected{% endif %}>{{ s | replace('_',' ') }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <button class="btn" type="submit">Create work order</button>
</form>

{% endblock %}
